<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Калькулятор-рисовалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --card: var(--tg-theme-secondary-bg-color, #f1f1f1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: 12px; gap: 10px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  #result { background: var(--card); border-radius: 14px; padding: 12px 16px; min-height: 84px;
    display: flex; flex-direction: column; justify-content: center; }
  #expr { color: var(--hint); font-size: 18px; min-height: 24px; word-break: break-all; }
  #answer { font-size: 36px; font-weight: 600; word-break: break-all; }
  #answer.err { font-size: 18px; color: #d33; font-weight: 500; }
  #wrap { flex: 1; position: relative; border-radius: 14px; overflow: hidden; background: #fff;
    border: 2px dashed var(--hint); min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #aaa; font-size: 18px; pointer-events: none; text-align: center; padding: 20px; }
  .row { display: flex; gap: 10px; }
  button { flex: 1; border: 0; border-radius: 12px; padding: 14px; font-size: 16px;
    background: var(--card); color: var(--text); }
  button.main { background: var(--btn); color: var(--btn-text); }
  #left { color: var(--hint); font-size: 12px; text-align: right; }
  #buy { display: none; flex: none; }
</style>
</head>
<body>
<div id="result">
  <div id="expr"></div>
  <div id="answer">—</div>
  <div id="left"></div>
</div>
<button id="buy" class="main"></button>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint">Нарисуй пример, например √64 или 12×(3+4)</div>
</div>
<div class="row">
  <button id="undo">↶ Отменить</button>
  <button id="clear" class="main">Очистить</button>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes(); } catch (e) {} }

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const exprEl = document.getElementById('expr');
const ansEl = document.getElementById('answer');
const leftEl = document.getElementById('left');
const buyBtn = document.getElementById('buy');
const initData = tg ? tg.initData : '';

let strokes = [];   // [[{x,y},...], ...] в CSS-пикселях
let current = null;
let timer = null;
let reqId = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * dpr;
  canvas.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}

function drawStroke(s, c = ctx, scale = 1) {
  c.lineWidth = 4 * scale;
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.strokeStyle = '#000';
  c.beginPath();
  s.forEach((p, i) => i ? c.lineTo(p.x * scale, p.y * scale) : c.moveTo(p.x * scale, p.y * scale));
  if (s.length === 1) c.lineTo(s[0].x * scale + 0.1, s[0].y * scale);
  c.stroke();
}

function redraw() {
  const r = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  strokes.forEach(s => drawStroke(s));
  hint.style.display = strokes.length ? 'none' : 'flex';
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  clearTimeout(timer);
  current = [pos(e)];
  strokes.push(current);
  redraw();
});
canvas.addEventListener('pointermove', e => {
  if (!current) return;
  current.push(pos(e));
  redraw();
});
function end() {
  if (!current) return;
  current = null;
  scheduleSolve();
}
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

function scheduleSolve() {
  clearTimeout(timer);
  if (!strokes.length) { reset(); return; }
  timer = setTimeout(solve, 900);  // распознаём через 0.9 с после последнего штриха
}

function reset() {
  reqId++;
  exprEl.textContent = '';
  ansEl.textContent = '—';
  ansEl.className = '';
}

function exportPng() {
  const r = canvas.getBoundingClientRect();
  const scale = Math.min(1, 900 / r.width);
  const out = document.createElement('canvas');
  out.width = Math.round(r.width * scale);
  out.height = Math.round(r.height * scale);
  const c = out.getContext('2d');
  c.fillStyle = '#fff';
  c.fillRect(0, 0, out.width, out.height);
  strokes.forEach(s => drawStroke(s, c, scale));
  return out.toDataURL('image/png');
}

function pretty(e) {
  return e.replace(/sqrt/g, '√').replace(/\*/g, '×').replace(/\//g, '÷')
          .replace(/pi/g, 'π');
}

async function solve() {
  const id = ++reqId;
  ansEl.className = '';
  ansEl.textContent = '…';
  try {
    const res = await fetch('/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: exportPng(), initData })
    });
    const data = await res.json();
    if (id !== reqId) return;  // пришёл устаревший ответ
    if (data.limit) {
      exprEl.textContent = '';
      leftEl.textContent = '';
      ansEl.className = 'err';
      ansEl.textContent = 'Запросы на этот месяц закончились';
      buyBtn.textContent = `Купить ${data.pack} запросов за ${data.price} ⭐`;
      buyBtn.style.display = 'block';
      return;
    }
    if (data.left !== undefined) leftEl.textContent = `Осталось запросов: ${data.left}`;
    if (data.error) {
      exprEl.textContent = '';
      ansEl.className = 'err';
      ansEl.textContent = data.error;
    } else {
      exprEl.textContent = pretty(data.expr) + ' =';
      ansEl.textContent = data.result;
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }
  } catch (e) {
    if (id !== reqId) return;
    ansEl.className = 'err';
    ansEl.textContent = 'Нет связи с сервером';
  }
}

buyBtn.onclick = async () => {
  if (!tg) return;
  try {
    const res = await fetch('/api/invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData })
    });
    const data = await res.json();
    if (!data.link) throw new Error('no link');
    tg.openInvoice(data.link, status => {
      if (status === 'paid') {
        buyBtn.style.display = 'none';
        ansEl.className = '';
        ansEl.textContent = 'Оплачено! Рисуй дальше';
        leftEl.textContent = '';
      }
    });
  } catch (e) {
    ansEl.className = 'err';
    ansEl.textContent = 'Не удалось открыть оплату';
  }
};

document.getElementById('clear').onclick = () => { strokes = []; redraw(); reset(); };
document.getElementById('undo').onclick = () => { strokes.pop(); redraw(); scheduleSolve(); };

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
